name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: sh .github/scripts/changed-components.sh

  api:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Same image as infra/docker/compose.yaml. Disposable per job: the
      # password below protects nothing outside this runner.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: ci-disposable-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AEGIS_DB_PASSWORD: ci-disposable-postgres
      AEGIS_TEST_DB_PASSWORD: ci-disposable-postgres
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-surefire-reports
          path: services/api/target/surefire-reports/
          retention-days: 7

  web:
    name: Web checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      # No dependency needs an install script; skipping them closes a supply-chain path (SonarQube S6505).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The only check to require on dev and main: component jobs may be skipped by
  # the change filter, and a skipped job must neither block nor hide a failure.
  result:
    name: CI result
    needs: [changes, api, web]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_NEEDED: ${{ needs.changes.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          WEB_NEEDED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          status=0
          echo "changes=$CHANGES_RESULT api=$API_NEEDED/$API_RESULT web=$WEB_NEEDED/$WEB_RESULT"
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::Change detection did not succeed ($CHANGES_RESULT)."
            status=1
          fi
          check() {
            if [ "$2" = true ] && [ "$3" != success ]; then
              echo "::error::$1 was required and ended as '$3'."
              status=1
            elif [ "$2" != true ] && [ "$3" != skipped ] && [ "$3" != success ]; then
              echo "::error::$1 ended as '$3'."
              status=1
            fi
          }
          check "API tests" "$API_NEEDED" "$API_RESULT"
          check "Web checks" "$WEB_NEEDED" "$WEB_RESULT"
          exit $status
