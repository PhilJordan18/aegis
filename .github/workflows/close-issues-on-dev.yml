name: Close issues merged into dev

# Closing keywords only act on the default branch (main); issues are done
# once their pull request is merged into dev.
on:
  pull_request:
    branches: [dev]
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced with a closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          numbers=$(printf '%s\n' "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
            | grep -oE '[0-9]+$' | sort -u)
          for number in $numbers; do
            gh issue close "$number" --reason completed --comment "Merged into dev in #$PR_NUMBER."
          done
