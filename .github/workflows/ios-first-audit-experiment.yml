# Diagnosis only (#67, mandate on #208): a bounded experiment on why the first
# UI test of a hosted iOS run sometimes abandons an accessibility audit (-56).
# It never gates anything and is not meant to be merged: it runs only on a pull
# request that changes this file.
#
# Run 1 (930feb3) ruled out a cold boot and host load. Hosted bundles since then
# show the slow phase in one place: in the English light pass, the tap that opens
# the blocked asset sheet waits 12-18 s for the app to go idle (about 1 s in the
# three other passes), then audit 4 takes 10.7-27.9 s or ends with -56.
#
# Run 2 asks who is busy during that phase: the app itself (a layout or
# animation loop in the English sheet would be a product defect) or a system
# process of the simulator. The catalogue test runs four times in four test
# processes on one booted simulator. A one-second sampler records the CPU of
# every process above 5 %, and the call stacks of the app whenever it stays
# above 50 % for three consecutive seconds (at most three samples). Tests are
# built once and never retried, skipped or given a longer audit timeout; a
# failed trial is recorded and the next one runs.
name: iOS first-audit experiment

on:
  pull_request:
    paths:
      - .github/workflows/ios-first-audit-experiment.yml

permissions:
  contents: read

concurrency:
  group: ios-first-audit-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  experiment:
    name: iOS first-audit experiment
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CATALOG: AegisMobileUITests/CatalogUITests/testCatalogueFilterSheetAndBackInBothLanguagesAndAppearances
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and simulator
        run: |
          sw_vers
          xcodebuild -version
          mkdir -p build/results
          destination=$(scripts/ios-destination.sh 2>build/results/destination.txt)
          cat build/results/destination.txt
          case "$destination" in
            "platform=iOS Simulator,id="?*) ;;
            *) echo "::error::unexpected destination '$destination'"; exit 1 ;;
          esac
          echo "IOS_DESTINATION=$destination" >> "$GITHUB_ENV"
          echo "UDID=${destination#*id=}" >> "$GITHUB_ENV"
      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project AegisMobile.xcodeproj -scheme AegisMobile \
            -configuration Debug -destination "$IOS_DESTINATION" \
            -derivedDataPath build/DerivedData -quiet
      - name: Trials
        run: |
          log=build/results/trials.tsv
          printf 'trial\ttest\tstart_epoch\tend_epoch\texit\n' > "$log"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" >/dev/null
          date +%s > build/results/ready_epoch.txt
          nohup ../../.github/scripts/simulator-load.sh "$UDID" build/results/simulator-load.tsv 2400 5 >/dev/null 2>&1 &
          # Per-process CPU, one line per process above 5 %, every second.
          (
            hot=0; taken=0
            printf 'epoch\tpid\tpcpu\trss_kb\tcommand\n' > build/results/process-cpu.tsv
            while :; do
              now=$(date +%s)
              ps -axo pid=,pcpu=,rss=,comm= | awk -v t="$now" '$2 >= 5 { c=$4; for (i=5;i<=NF;i++) c=c" "$i; n=split(c,a,"/"); printf "%s\t%s\t%s\t%s\t%s\n", t, $1, $2, $3, a[n] }' >> build/results/process-cpu.tsv
              app=$(ps -axo pid=,pcpu=,comm= | awk '$0 ~ /AegisMobile\.app\/AegisMobile$/ { print $1, int($2) }' | head -1)
              if [ -n "$app" ] && [ "${app#* }" -ge 50 ]; then hot=$((hot + 1)); else hot=0; fi
              if [ "$hot" -ge 3 ] && [ "$taken" -lt 3 ]; then
                taken=$((taken + 1)); hot=0
                sample "${app%% *}" 2 -file "build/results/app-sample-$taken-$now.txt" >/dev/null 2>&1 &
              fi
              sleep 1
            done
          ) >/dev/null 2>&1 &
          cpu_sampler=$!
          for n in 1 2 3 4; do
            start=$(date +%s); status=0
            xcodebuild test-without-building -project AegisMobile.xcodeproj -scheme AegisMobile \
              -configuration Debug -destination "$IOS_DESTINATION" \
              -derivedDataPath build/DerivedData -parallel-testing-enabled NO -quiet \
              -resultBundlePath "build/results/trial-$n.xcresult" -only-testing:"$CATALOG" || status=$?
            printf '%s\t%s\t%s\t%s\t%s\n' "$n" "${CATALOG##*/}" "$start" "$(date +%s)" "$status" >> "$log"
            # Materialize the bundle database for the analysis below; read-only for the test outcome.
            xcrun xcresulttool get test-results summary --path "build/results/trial-$n.xcresult" >/dev/null || true
          done
          kill "$cpu_sampler" 2>/dev/null || true
          cat "$log"
      - name: Busy processes around each audit
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, csv, glob, os, re, sqlite3
          APPLE = 978307200
          cpu = collections.defaultdict(list)
          for r in csv.DictReader(open("build/results/process-cpu.tsv"), delimiter="\t"):
              cpu[int(r["epoch"])].append((float(r["pcpu"]), r["command"]))
          def top(a, b):
              acc = collections.Counter()
              for t in range(int(a), int(b) + 1):
                  for p, c in cpu.get(t, []):
                      acc[c] += p
              span = max(1, int(b) - int(a) + 1)
              return ", ".join(f"{c} {v / span:.0f}%" for c, v in acc.most_common(4))
          print("| Trial | Context | Step | Duration | Mean CPU of the busiest processes |")
          print("|---:|---|---|---:|---|")
          for path in sorted(glob.glob("build/results/trial-*.xcresult/database.sqlite3")):
              n = path.split("trial-")[1].split(".")[0]
              db = sqlite3.connect(path)
              ctx = ""
              for title, s, f in db.execute("select title, startTime, finishTime from Activities where parent_fk is null order by startTime"):
                  if title.startswith("Added attachment named"):
                      ctx = title.split("'")[1]
                  m = re.match(r"Accessibility audit (warm-up|\d+) (completed|ended with an error) in ([\d.]+) s", title)
                  if m:
                      d = float(m.group(3)); end = s + APPLE
                      print(f"| {n} | {ctx} | audit {m.group(1)}{'' if m.group(2) == 'completed' else ' ERR'} | {d:.1f} s | {top(end - d, end)} |")
                  elif title.startswith('Tap "asset.card.MM-002"') and f:
                      print(f"| {n} | {ctx} | open sheet | {f - s:.1f} s | {top(s + APPLE, f + APPLE)} |")
          print()
          print("App samples:", ", ".join(sorted(os.path.basename(p) for p in glob.glob("build/results/app-sample-*.txt"))) or "none")
          EOF
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-first-audit-experiment
          path: |
            apps/ios/build/results/*.tsv
            apps/ios/build/results/*.txt
            apps/ios/build/results/*.xcresult
          retention-days: 14
