# SonarQube Cloud automatic analysis settings.
# The French and English Manager catalogs mirror each other key for key by design
# (docs/localisation/convention.md): their parallel structure is not copied logic,
# so they are left out of duplication detection only. Every other rule still applies.
sonar.cpd.exclusions=apps/admin-web/src/i18n/messages/**
# The Lumière du hub v3 mock-ups in docs/design/identite/v3/ are design references
# received from the designer and kept as received (docs/design/identite/reference.md);
# they are never served by an Aegis application, so they are not analysed.
sonar.exclusions=docs/design/identite/v3/**
