<svg width="820" height="420" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="420" fill="#ffffff"/>

  <text x="140" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">AVANT</text>
  <text x="385" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">PROFIL</text>
  <text x="640" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">ARRIÈRE</text>

  <!-- AVANT -->
  <rect x="25" y="50" width="50" height="45" fill="#f5f5f5" stroke="#666666"/>
  <text x="50" y="76" text-anchor="middle" font-size="11" fill="#333333">écran</text>

  <rect x="40" y="90" width="200" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="140" y="120" text-anchor="middle" font-size="12" fill="#333333">hub</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#333333">écran + calcul + réseau</text>
  <circle cx="217" cy="157" r="5" fill="#82b366"/>
  <text x="195" y="174" text-anchor="middle" font-size="10" fill="#666666">voyant état</text>

  <rect x="40" y="200" width="95" height="90" rx="8" fill="#f5f5f5" stroke="#666666"/>
  <text x="87" y="216" text-anchor="middle" font-size="12" fill="#333333">cellule 1</text>
  <rect x="55" y="228" width="65" height="45" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="87" y="254" text-anchor="middle" font-size="10" fill="#412402">trappe</text>
  <circle cx="128" cy="234" r="4" fill="#82b366"/>

  <rect x="145" y="200" width="95" height="90" rx="8" fill="#f5f5f5" stroke="#666666"/>
  <text x="192" y="216" text-anchor="middle" font-size="12" fill="#333333">cellule 2</text>
  <rect x="160" y="228" width="65" height="45" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="192" y="254" text-anchor="middle" font-size="10" fill="#412402">trappe</text>
  <circle cx="233" cy="234" r="4" fill="#82b366"/>

  <!-- PROFIL -->
  <rect x="335" y="70" width="60" height="14" fill="#5F5E5A"/>
  <text x="365" y="80" text-anchor="middle" font-size="7" fill="#ffffff">rail (fixation murale)</text>
  <rect x="330" y="90" width="55" height="180" fill="#f5f5f5" stroke="#666666"/>
  <circle cx="327" cy="115" r="5" fill="none" stroke="#666666" stroke-dasharray="2,2"/>
  <circle cx="327" cy="175" r="5" fill="none" stroke="#666666" stroke-dasharray="2,2"/>
  <circle cx="327" cy="235" r="5" fill="none" stroke="#666666" stroke-dasharray="2,2"/>
  <text x="234" y="163" font-size="9" fill="#666666">points de fixation</text>
  <text x="234" y="175" font-size="9" fill="#666666">(bouchon amovible si inutilisés)</text>

  <circle cx="385" cy="180" r="4" fill="#854F0B"/>
  <rect x="378" y="140" width="8" height="40" fill="#FAEEDA" stroke="#854F0B"/>
  <rect x="385" y="176" width="70" height="10" fill="#FAEEDA" stroke="#854F0B" transform="rotate(-35 385 176)"/>
  <text x="460" y="150" font-size="9" fill="#412402">trappe (ouverte,</text>
  <text x="460" y="162" font-size="9" fill="#412402">charnière sur cadre)</text>

  <!-- ARRIÈRE -->
  <rect x="540" y="90" width="200" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="640" y="106" text-anchor="middle" font-size="12" fill="#333333">hub — arrière</text>
  <rect x="540" y="90" width="200" height="8" fill="#5F5E5A"/>
  <rect x="560" y="140" width="40" height="20" fill="#EEEEEE" stroke="#000000"/>
  <text x="580" y="154" text-anchor="middle" font-size="10" fill="#333333">alim</text>
  <rect x="615" y="140" width="30" height="20" fill="#EEEEEE" stroke="#000000"/>
  <text x="630" y="154" text-anchor="middle" font-size="10" fill="#333333">J1</text>
  <rect x="660" y="140" width="30" height="20" fill="#EEEEEE" stroke="#000000"/>
  <text x="675" y="154" text-anchor="middle" font-size="10" fill="#333333">J2</text>

  <rect x="540" y="200" width="130" height="80" rx="8" fill="#f5f5f5" stroke="#666666"/>
  <text x="605" y="216" text-anchor="middle" font-size="12" fill="#333333">cellule — arrière</text>
  <rect x="540" y="200" width="130" height="8" fill="#5F5E5A"/>
  <rect x="590" y="248" width="30" height="20" fill="#EEEEEE" stroke="#000000"/>
  <text x="605" y="262" text-anchor="middle" font-size="10" fill="#333333">J</text>

  <text x="540" y="305" font-size="10" fill="#666666">passe-câble + délestage</text>
  <text x="540" y="317" font-size="10" fill="#666666">sur chaque sortie</text>
</svg>
