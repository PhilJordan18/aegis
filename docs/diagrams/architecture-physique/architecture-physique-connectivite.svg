<svg width="840" height="460" viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Fond sombre -->
  <rect width="840" height="460" fill="#1e1e1e"/>

  <!-- Markers flèches -->
  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6cb2ff"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8fd382"/>
    </marker>
  </defs>

  <!-- Titre -->
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#e8e8e8">AEGIS — CONNECTIVITÉ MATÉRIELLE (BUS DAISY-CHAIN RJ45)</text>
  <text x="30" y="56" font-size="12" fill="#888888">Câble unique Cat6 : Alimentation 12V + Masse GND + Bus différentiel RS-485</text>

  <!-- Bloc Alimentation Externe -->
  <rect x="30" y="100" width="160" height="64" rx="8" fill="#2d2222" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="110" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff7b72">Alimentation 12V</text>
  <text x="110" y="146" text-anchor="middle" font-size="11" fill="#e8e8e8">Bloc 12V DC / 5A (Jack)</text>

  <!-- Ligne Alim -> Hub -->
  <line x1="190" y1="132" x2="250" y2="132" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="220" y="122" text-anchor="middle" font-size="10" fill="#ff7b72">12V DC</text>

  <!-- MASTER HUB (7.0" ESP32-S3) -->
  <rect x="250" y="80" width="260" height="150" rx="10" fill="#243828" stroke="#8fd382" stroke-width="2"/>
  <rect x="265" y="95" width="230" height="24" rx="4" fill="#324f38"/>
  <text x="380" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#8fd382">MASTER HUB (7.0" HMI)</text>

  <text x="270" y="142" font-size="11" fill="#e8e8e8">• Écran 7" Tactile (ESP32-S3 All-in-One)</text>
  <text x="270" y="160" font-size="11" fill="#e8e8e8">• Wi-Fi MQTT (Backend Aegis) + QR Code</text>
  <text x="270" y="178" font-size="11" fill="#e8e8e8">• Buck 12V ➔ 5V + Transceiver MAX485</text>
  <rect x="390" y="194" width="105" height="26" rx="4" fill="#1b2a1f" stroke="#8fd382"/>
  <text x="442" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#8fd382">RJ45 BUS OUT</text>

  <!-- Liaison Câble 1 (Hub -> Cellule 1) -->
  <path d="M 442 220 L 442 270 L 140 270 L 140 310" fill="none" stroke="#6cb2ff" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="230" y="258" width="170" height="22" rx="4" fill="#1b2838" stroke="#6cb2ff"/>
  <text x="315" y="273" text-anchor="middle" font-size="10" font-weight="bold" fill="#6cb2ff">Câble Cat6 (20 cm) : 12V + RS485</text>

  <!-- CELLULE 1 -->
  <rect x="50" y="310" width="220" height="130" rx="8" fill="#303030" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="160" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8e8e8">CELLULE 1 (CASIER)</text>
  <text x="65" y="352" font-size="11" fill="#8fd382">• MCU Arduino / RP2040 (DIP: 01)</text>
  <text x="65" y="368" font-size="11" fill="#e8e8e8">• Verrou 12V (Sutertech 330 lbs)</text>
  <text x="65" y="384" font-size="11" fill="#e8e8e8">• Double capteur : Reed + Microswitch</text>
  <text x="65" y="400" font-size="11" fill="#e8e8e8">• Voyant RGB + Éjecteur à ressort</text>
  <rect x="65" y="410" width="85" height="20" rx="3" fill="#202020" stroke="#6cb2ff"/>
  <text x="107" y="424" text-anchor="middle" font-size="9" fill="#6cb2ff">RJ45 BUS IN</text>
  <rect x="170" y="410" width="85" height="20" rx="3" fill="#202020" stroke="#6cb2ff"/>
  <text x="212" y="424" text-anchor="middle" font-size="9" fill="#6cb2ff">RJ45 BUS OUT</text>

  <!-- Liaison Câble 2 (Cellule 1 -> Cellule 2) -->
  <path d="M 255 420 L 310 420 L 310 370 L 320 370" fill="none" stroke="#6cb2ff" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="285" y="405" text-anchor="middle" font-size="9" fill="#6cb2ff">Cat6</text>

  <!-- CELLULE 2 -->
  <rect x="320" y="310" width="220" height="130" rx="8" fill="#303030" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="430" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8e8e8">CELLULE 2 (CASIER)</text>
  <text x="335" y="352" font-size="11" fill="#8fd382">• MCU Arduino / RP2040 (DIP: 02)</text>
  <text x="335" y="368" font-size="11" fill="#e8e8e8">• Verrou 12V (Sutertech 330 lbs)</text>
  <text x="335" y="384" font-size="11" fill="#e8e8e8">• Double capteur : Reed + Microswitch</text>
  <text x="335" y="400" font-size="11" fill="#e8e8e8">• Voyant RGB + Éjecteur à ressort</text>
  <rect x="335" y="410" width="85" height="20" rx="3" fill="#202020" stroke="#6cb2ff"/>
  <text x="377" y="424" text-anchor="middle" font-size="9" fill="#6cb2ff">RJ45 BUS IN</text>
  <rect x="440" y="410" width="85" height="20" rx="3" fill="#202020" stroke="#6cb2ff"/>
  <text x="482" y="424" text-anchor="middle" font-size="9" fill="#6cb2ff">RJ45 BUS OUT</text>

  <!-- Liaison Câble 3 (Cellule 2 -> Cellule 3) -->
  <path d="M 525 420 L 580 420 L 580 370 L 590 370" fill="none" stroke="#6cb2ff" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="555" y="405" text-anchor="middle" font-size="9" fill="#6cb2ff">Cat6</text>

  <!-- CELLULE 3 (Dernière de chaîne) -->
  <rect x="590" y="310" width="220" height="130" rx="8" fill="#303030" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="700" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8e8e8">CELLULE 3 (CASIER)</text>
  <text x="605" y="352" font-size="11" fill="#8fd382">• MCU Arduino / RP2040 (DIP: 03)</text>
  <text x="605" y="368" font-size="11" fill="#e8e8e8">• Verrou 12V (Sutertech 330 lbs)</text>
  <text x="605" y="384" font-size="11" fill="#e8e8e8">• Double capteur : Reed + Microswitch</text>
  <text x="605" y="400" font-size="11" fill="#e8e8e8">• Terminaison 120 Ω : ACTIVÉE</text>
  <rect x="605" y="410" width="85" height="20" rx="3" fill="#202020" stroke="#6cb2ff"/>
  <text x="647" y="424" text-anchor="middle" font-size="9" fill="#6cb2ff">RJ45 BUS IN</text>
  <rect x="710" y="410" width="85" height="20" rx="3" fill="#3a2525" stroke="#f0a500"/>
  <text x="752" y="424" text-anchor="middle" font-size="9" fill="#f0a500">Term. 120 Ω</text>

  <!-- Cartouche Brochage RJ45 -->
  <rect x="540" y="80" width="270" height="150" rx="8" fill="#19232d" stroke="#6cb2ff" stroke-width="1.2"/>
  <text x="675" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#6cb2ff">BROCHAGE DU CÂBLE RJ45 (Cat6)</text>
  <text x="555" y="124" font-size="11" fill="#6cb2ff">Broches 1 &amp; 2 :</text>
  <text x="645" y="124" font-size="11" fill="#e8e8e8">RS-485 Data (A / B)</text>
  <text x="555" y="144" font-size="11" fill="#6cb2ff">Broches 4 &amp; 5 :</text>
  <text x="645" y="144" font-size="11" fill="#ff7b72">+12V DC Puissance</text>
  <text x="555" y="164" font-size="11" fill="#6cb2ff">Broches 7 &amp; 8 :</text>
  <text x="645" y="164" font-size="11" fill="#a3a3a3">Masse GND (0V)</text>
  <text x="555" y="184" font-size="11" fill="#6cb2ff">Broches 3 &amp; 6 :</text>
  <text x="645" y="184" font-size="11" fill="#e8e8e8">Sense / Détection</text>
  <text x="555" y="212" font-size="10" fill="#888888">Bypass cuivre 2 oz direct entre IN et OUT</text>
</svg>
