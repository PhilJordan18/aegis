<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="360" fill="#ffffff"/>

  <rect x="40" y="30" width="30" height="290" fill="#EEEEEE" stroke="#666666"/>
  <text x="55" y="46" text-anchor="middle" font-size="12" fill="#333333">mur</text>

  <rect x="65" y="90" width="55" height="12" fill="#5F5E5A" transform="rotate(25 92 96)"/>
  <text x="92" y="99" text-anchor="middle" font-size="7" fill="#ffffff" transform="rotate(25 92 96)">rail (mur)</text>

  <rect x="120" y="90" width="55" height="12" fill="#82b366" transform="rotate(25 147 96)"/>
  <text x="147" y="99" text-anchor="middle" font-size="7" fill="#ffffff" transform="rotate(25 147 96)">rail (unité)</text>

  <rect x="130" y="110" width="160" height="150" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="210" y="126" text-anchor="middle" font-size="12" fill="#333333">hub / cellule</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#666666"/>
    </marker>
  </defs>
  <line x1="230" y1="60" x2="204" y2="97" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="45" text-anchor="middle" font-size="10" fill="#666666">glisser pour accrocher</text>

  <polygon points="300,95 310,95 305,105" fill="#5F5E5A"/>
  <polygon points="480,95 490,95 485,105" fill="#5F5E5A"/>
  <text x="390" y="70" text-anchor="middle" font-size="9" fill="#666666">repères de position</text>
  <text x="390" y="82" text-anchor="middle" font-size="9" fill="#666666">(espacement répétable)</text>

  <rect x="470" y="90" width="55" height="12" fill="none" stroke="#82b366" stroke-dasharray="3,2" transform="rotate(25 497 96)"/>
  <rect x="480" y="110" width="160" height="150" rx="8" fill="none" stroke="#82b366" stroke-dasharray="4,3"/>
  <text x="560" y="126" text-anchor="middle" font-size="11" fill="#5F5E5A">cellule future</text>
  <text x="560" y="140" text-anchor="middle" font-size="11" fill="#5F5E5A">(ajoutée plus tard,</text>
  <text x="560" y="154" text-anchor="middle" font-size="11" fill="#5F5E5A">même rail)</text>

  <text x="40" y="315" font-size="10" fill="#666666">chaque cube s'accroche individuellement, par gravité — aucun démontage requis pour en ajouter un;</text>
  <text x="40" y="329" font-size="10" fill="#666666">la bride optionnelle ne sert qu'à bloquer le jeu latéral une fois accroché.</text>
</svg>
