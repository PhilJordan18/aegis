<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#854F0B"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="30" height="240" fill="#EEEEEE" stroke="#666666"/>
  <text x="55" y="56" text-anchor="middle" font-size="11" fill="#333333">cadre</text>
  <text x="55" y="68" text-anchor="middle" font-size="11" fill="#333333">(fixe)</text>

  <rect x="90" y="60" width="150" height="180" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="165" y="76" text-anchor="middle" font-size="12" fill="#412402">trappe</text>

  <rect x="70" y="150" width="35" height="14" fill="#854F0B"/>
  <text x="87" y="140" text-anchor="middle" font-size="9" fill="#412402">pêne (verrouillé)</text>

  <line x1="40" y1="157" x2="66" y2="157" stroke="#854F0B" stroke-width="1.5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="53" y="180" text-anchor="middle" font-size="9" fill="#854F0B">ressort (pousse le</text>
  <text x="53" y="191" text-anchor="middle" font-size="9" fill="#854F0B">pêne vers l'extérieur)</text>

  <rect x="260" y="130" width="70" height="35" fill="none" stroke="#333333"/>
  <path d="M270,147 q7,-10 14,0 q7,-10 14,0 q7,-10 14,0 q7,-10 14,0" fill="none" stroke="#333333"/>
  <text x="295" y="178" text-anchor="middle" font-size="10" fill="#333333">solénoïde</text>

  <line x1="260" y1="150" x2="107" y2="156" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <text x="230" y="120" text-anchor="middle" font-size="9" fill="#854F0B">impulsion brève →</text>
  <text x="230" y="131" text-anchor="middle" font-size="9" fill="#854F0B">rétracte le pêne</text>

  <rect x="60" y="70" width="75" height="20" fill="none" stroke="#333333" stroke-dasharray="3,2"/>
  <text x="220" y="74" font-size="9" fill="#333333">capteur porte (reed,</text>
  <text x="220" y="85" font-size="9" fill="#333333">monté sur le cadre)</text>

  <circle cx="53" cy="220" r="5" fill="#82b366"/>
  <text x="10" y="240" font-size="9" fill="#666666">voyant (sur le cadre,</text>
  <text x="10" y="251" font-size="9" fill="#666666">jamais sur la trappe)</text>

  <text x="40" y="300" font-size="10" fill="#333333">au repos : ressort maintient le pêne en position verrouillée (fail-secure).</text>
  <text x="40" y="314" font-size="10" fill="#333333">impulsion momentanée du solénoïde : rétracte le pêne le temps d'ouvrir; le biseau du pêne le reverrouille</text>
  <text x="40" y="328" font-size="10" fill="#333333">seul à la fermeture — aucun signal requis pour se reverrouiller.</text>
</svg>
