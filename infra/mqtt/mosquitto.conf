# Aegis broker. See infra/mqtt/README.md.
# Authentication and ACL are global (default per_listener_settings false, an
# option deprecated in 2.1 and therefore not set): every listener uses the same
# password file and ACL, so a credential has the same rights in plaintext and TLS.
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/config/acl
persistence false
log_dest stdout

# Plaintext listener for the simulator and the API on the isolated Docker network.
# Compose publishes it on 127.0.0.1 only. A real hub never uses it (doc 10 §4.2).
listener 1883 0.0.0.0

# Empty by default (infra/mqtt/no-tls/). infra/docker/compose.tls.yaml mounts
# infra/mqtt/tls/ here to add the TLS listener 8883 once lab certificates exist.
include_dir /mosquitto/config/conf.d
