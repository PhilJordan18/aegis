allow_anonymous false
password_file /run/aegis-mqtt/passwords
acl_file /run/aegis-mqtt/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
listener 8883 0.0.0.0
cafile /run/aegis-mqtt/ca.crt
certfile /run/aegis-mqtt/server.crt
keyfile /run/aegis-mqtt/server.key
tls_version tlsv1.2
require_certificate false
