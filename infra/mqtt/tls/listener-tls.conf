# TLS listener for the real hub (doc 10 §4.2, ADR-004). Loaded only through
# infra/docker/compose.tls.yaml. Certificates are copied by mqtt-tls-init into a
# volume readable by the mosquitto user; see infra/mqtt/README.md.
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# Minimum version; TLS 1.3 stays allowed.
tls_version tlsv1.2
# Server authentication only: the hub authenticates with its username and secret.
# mTLS is a possible evolution, not a P0 requirement.
require_certificate false
