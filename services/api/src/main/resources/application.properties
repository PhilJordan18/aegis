spring.application.name=aegis-control
aegis.version=0.1.0
server.address=${AEGIS_API_BIND:127.0.0.1}
spring.datasource.url=jdbc:postgresql://${AEGIS_DB_HOST:localhost}:${AEGIS_DB_PORT:5432}/${AEGIS_DB_NAME:aegis}
spring.datasource.username=${AEGIS_DB_USER:aegis}
spring.datasource.password=${AEGIS_DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.validate-on-migrate=true
# Migrations may run as an owner role distinct from the application role; unset, they use the datasource account.
spring.flyway.user=${AEGIS_DB_MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${AEGIS_DB_MIGRATION_PASSWORD:${spring.datasource.password}}
spring.flyway.placeholders[application_role]=${AEGIS_DB_APPLICATION_ROLE:aegis_app}
spring.jackson.deserialization.fail-on-unknown-properties=true

aegis.security.jwt.secret=${AEGIS_JWT_SECRET:}
aegis.security.jwt.issuer=aegis-control
aegis.security.jwt.audience=aegis-api

aegis.identity.demo-accounts.enabled=${AEGIS_DEMO_ACCOUNTS_ENABLED:false}
aegis.identity.demo-accounts.admin.email=${AEGIS_DEMO_ADMIN_EMAIL:admin@aegis.demo}
aegis.identity.demo-accounts.admin.display-name=Administrateur D\u00e9mo
aegis.identity.demo-accounts.admin.password=${AEGIS_DEMO_ADMIN_PASSWORD:}
aegis.identity.demo-accounts.admin.maximum-access-level=STANDARD
aegis.identity.demo-accounts.technician.email=${AEGIS_DEMO_TECHNICIAN_EMAIL:technician@aegis.demo}
aegis.identity.demo-accounts.technician.display-name=Technicien D\u00e9mo
aegis.identity.demo-accounts.technician.password=${AEGIS_DEMO_TECHNICIAN_PASSWORD:}
aegis.identity.demo-accounts.technician.maximum-access-level=STANDARD

aegis.lockers.demo-locker.enabled=${AEGIS_DEMO_LOCKER_ENABLED:false}

aegis.reservations.expiry.scheduled=true
aegis.reservations.expiry.interval=PT15S
aegis.reservations.expiry.batch-size=100

# Backend MQTT account of document 10, section 6.2; the password only comes from the environment.
aegis.mqtt.enabled=${AEGIS_MQTT_ENABLED:false}
aegis.mqtt.url=${AEGIS_MQTT_URL:tcp://127.0.0.1:1883}
aegis.mqtt.username=${AEGIS_MQTT_API_USER:aegis_api}
aegis.mqtt.password=${AEGIS_MQTT_API_PASSWORD:}
aegis.mqtt.client-id=${AEGIS_MQTT_CLIENT_ID:aegis-api}
aegis.mqtt.allow-insecure-remote=${AEGIS_MQTT_ALLOW_INSECURE_REMOTE:false}

# Unlock command outbox worker (ADR-005, document 08 section 9.2); it requires aegis.mqtt.enabled=true.
aegis.commands.dispatcher.enabled=${AEGIS_COMMAND_DISPATCHER_ENABLED:false}
aegis.commands.dispatcher.interval=PT1S
aegis.commands.dispatcher.lease=PT15S
aegis.commands.dispatcher.publish-timeout=PT5S
aegis.commands.dispatcher.batch-size=20

# Hub challenge flow and its display payload keys (decision of 11 November 2026, #43). Keys live outside PostgreSQL:
# AEGIS_DISPLAY_KEYS is keyId:base64(32 bytes)[,keyId:base64(32 bytes)...], and AEGIS_DISPLAY_ACTIVE_KEY_ID names the
# key of new rows. Enabled without valid keys, the application refuses to start; disabled, no challenge is prepared.
aegis.display.enabled=${AEGIS_DISPLAY_ENABLED:false}
aegis.display.keys=${AEGIS_DISPLAY_KEYS:}
aegis.display.active-key-id=${AEGIS_DISPLAY_ACTIVE_KEY_ID:}
# Preparation rate limit of document 06, section 6.5, per user and locker; the threshold is still to be qualified.
aegis.display.preparation.max-per-window=${AEGIS_PREPARATION_MAX_PER_WINDOW:6}
aegis.display.preparation.window=${AEGIS_PREPARATION_WINDOW:PT10M}
# Display outbox worker (document 10, section 27); it requires aegis.mqtt.enabled=true and aegis.display.enabled=true.
aegis.display.dispatcher.enabled=${AEGIS_DISPLAY_DISPATCHER_ENABLED:false}
aegis.display.dispatcher.interval=PT1S
aegis.display.dispatcher.lease=PT15S
aegis.display.dispatcher.publish-timeout=PT5S
aegis.display.dispatcher.batch-size=20
# End of life of challenges and display rows (expiry, status message, purge of expired ciphertext).
aegis.display.expiry.scheduled=true
aegis.display.expiry.interval=PT5S
# Outcome of authorized checkouts (#47): confirmation, deadline and anomaly; ingestion also triggers it per fact.
aegis.operations.evaluation.scheduled=true
aegis.operations.evaluation.interval=PT1S
aegis.operations.evaluation.batch-size=100
