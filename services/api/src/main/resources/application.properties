spring.application.name=aegis-control
aegis.version=0.1.0
server.address=${AEGIS_API_BIND:127.0.0.1}
spring.datasource.url=jdbc:postgresql://${AEGIS_DB_HOST:localhost}:${AEGIS_DB_PORT:5432}/${AEGIS_DB_NAME:aegis}
spring.datasource.username=${AEGIS_DB_USER:aegis}
spring.datasource.password=${AEGIS_DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.validate-on-migrate=true
spring.jackson.deserialization.fail-on-unknown-properties=true

aegis.security.jwt.secret=${AEGIS_JWT_SECRET:}
aegis.security.jwt.issuer=aegis-control
aegis.security.jwt.audience=aegis-api

aegis.identity.demo-accounts.enabled=${AEGIS_DEMO_ACCOUNTS_ENABLED:false}
aegis.identity.demo-accounts.admin.email=${AEGIS_DEMO_ADMIN_EMAIL:admin@aegis.demo}
aegis.identity.demo-accounts.admin.display-name=Administrateur D\u00e9mo
aegis.identity.demo-accounts.admin.password=${AEGIS_DEMO_ADMIN_PASSWORD:}
aegis.identity.demo-accounts.admin.maximum-access-level=STANDARD
aegis.identity.demo-accounts.technician.email=${AEGIS_DEMO_TECHNICIAN_EMAIL:technician@aegis.demo}
aegis.identity.demo-accounts.technician.display-name=Technicien D\u00e9mo
aegis.identity.demo-accounts.technician.password=${AEGIS_DEMO_TECHNICIAN_PASSWORD:}
aegis.identity.demo-accounts.technician.maximum-access-level=STANDARD
